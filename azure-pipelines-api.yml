trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/SvagsCorporate.Api/*
      - backend/SvagsCorporate.Api/**

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: 'Release'
  projectPath: 'backend/SvagsCorporate.Api/SvagsCorporate.Api.csproj'
  azureServiceConnection: 'SVAGS-TECHNOLOGIES-Azure-Prod'
  apiAppName: 'svags-corporate-api'

stages:

# ============================================================
# BUILD
# ============================================================
- stage: Build
  displayName: 'Build API'

  jobs:
  - job: BuildApi
    displayName: 'Build .NET 10 API'

    steps:

    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '$(projectPath)'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '$(projectPath)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Publish'
      inputs:
        command: 'publish'
        projects: '$(projectPath)'
        arguments: '--configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/api'
        zipAfterPublish: false

    - task: ArchiveFiles@2
      displayName: 'Create API ZIP'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/api'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/svags-corporate-api.zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish API Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/svags-corporate-api.zip'
        ArtifactName: 'api'
        publishLocation: 'Container'


# ============================================================
# DEPLOY
# ============================================================
- stage: Deploy_PROD
  displayName: 'Deploy API to PROD'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - deployment: DeployApi
    displayName: 'Deploy svags-corporate-api'

    environment: 'PROD'

    strategy:
      runOnce:
        deploy:

          steps:

          - download: current
            artifact: api

          - task: AzureWebApp@1
            displayName: 'Deploy API to Azure App Service'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(apiAppName)'
              package: '$(Pipeline.Workspace)/api/svags-corporate-api.zip'