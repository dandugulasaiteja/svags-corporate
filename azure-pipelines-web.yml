trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/**
      - public/**
      - angular.json
      - package.json
      - package-lock.json
      - tsconfig*.json
      - server.ts
      - server.mts
      - server.tsconfig.json

pr: none

pool:
  vmImage: 'ubuntu-24.04'

variables:
  nodeVersion: '24.x'
  azureServiceConnection: 'SVAGS-TECHNOLOGIES-Azure-Prod'
  webAppName: 'svags-corporate-web'
  buildConfiguration: 'production'

stages:

# ============================================================
# BUILD
# ============================================================
- stage: Build
  displayName: 'Build Web'

  jobs:
  - job: BuildWeb
    displayName: 'Build Angular SSR'

    steps:

    - task: NodeTool@0
      displayName: 'Install Node.js 24'
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        node --version
        npm --version
      displayName: 'Verify Node.js'

    - script: |
        npm ci
      displayName: 'Install dependencies'

    - script: |
        npm run build
      displayName: 'Build Angular SSR'

    - script: |
        test -f dist/svags-corporate/server/server.mjs
      displayName: 'Verify SSR server output'

    # Remove development-only packages after build.
    # Angular SSR runtime files remain in dist/.
    - script: |
        npm prune --omit=dev
      displayName: 'Prepare production dependencies'

    # Prepare deployment package
    - task: CopyFiles@2
      displayName: 'Copy deployment files'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: |
          dist/**
          package.json
          package-lock.json
          node_modules/**
        TargetFolder: '$(Build.ArtifactStagingDirectory)/web'
        CleanTargetFolder: true
        OverWrite: true

    - task: ArchiveFiles@2
      displayName: 'Create Web ZIP'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/web'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/svags-corporate-web.zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Web Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/svags-corporate-web.zip'
        ArtifactName: 'web'
        publishLocation: 'Container'


# ============================================================
# DEPLOY
# ============================================================
- stage: Deploy_PROD
  displayName: 'Deploy Web to PROD'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - deployment: DeployWeb
    displayName: 'Deploy svags-corporate-web'

    environment: 'PROD'

    strategy:
      runOnce:
        deploy:

          steps:

          - download: current
            artifact: web

          - task: AzureWebApp@1
            displayName: 'Deploy Website to Azure App Service'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/web/svags-corporate-web.zip'
              appSettings: |
                -SCM_DO_BUILD_DURING_DEPLOYMENT false